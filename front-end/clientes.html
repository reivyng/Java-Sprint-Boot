<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
</head>
<body>
    <header>
        <h1 class="titulo">Gestión de Clientes</h1>
    </header>
    <nav>
        <ul>
            <li><a href="gestion_pedidos.html">Inicio</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vendedores.html">Vendedores</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="pedido-producto.html">Detalles de Pedido</a></li>
        </ul>
    </nav>
    <main class="container">
        <h2>Lista de Clientes</h2>
        <!-- Formulario de búsqueda con opciones -->
        <form id="search-form" class="search-form">
            <select id="search-type">
                <option value="id">ID</option>
                <option value="name">Nombre</option>
                <option value="phone">Teléfono</option>
            </select>
            <input type="text" id="search-input" placeholder="Buscar..." />
            <button type="submit">🔍</button>
        </form>

        <!-- Botón para agregar cliente -->
        <button class="button" id="add-client">Agregar Cliente</button>

        <!-- Tabla de clientes -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Celular</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="client-list">
                <!-- Los datos de la API se cargarán aquí -->
            </tbody>
        </table>
    </main>

    <!-- Modal para agregar/editar cliente -->
    <div id="add-client-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="toggleForm()">&times;</span>
            <h3>Agregar/Editar Cliente</h3>
            <form id="client-form" class="form">
                <input type="hidden" id="client-id" name="client-id">
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" placeholder="Ingrese el nombre" required>
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="text" id="phone" name="phone" placeholder="Ingrese el teléfono" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleForm()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/clients.js"></script>
    <script>
        // Mostrar/ocultar el formulario
        function toggleForm() {
            const form = document.getElementById('add-client-modal');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        // Asociar el botón "Agregar Cliente" con el formulario
        document.getElementById('add-client').addEventListener('click', toggleForm);

        document.getElementById('client-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const clientId = document.getElementById('client-id').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            const clientData = {
                nameClient: name,
                phoneClient: phone,
                status: 1, // Enviar 1 para activo
            };

            if (clientId) {
                // Si hay un ID, actualiza el cliente
                clientData.idClient = clientId;
                updateClient(clientData);
            } else {
                // Si no hay ID, crea un nuevo cliente
                createClient(clientData);
            }
        });
    </script>
</body>
</html>
