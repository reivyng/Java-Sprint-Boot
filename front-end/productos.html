<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
</head>
<body>
    <header>
        <h1>Gestión de Productos</h1>
    </header>
    <nav>
        <ul>
            <li><a href="gestion_pedidos.html">Inicio</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vendedores.html">Vendedores</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="pedido-producto.html">Detalles de Pedido</a></li>
        </ul>
    </nav>
    <main class="container">
        <h2>Lista de Productos</h2>
        <button class="button" id="add-product">Agregar Producto</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Los datos de la API se cargarán aquí -->
            </tbody>
        </table>
    </main>

    <!-- Modal para agregar/editar producto -->
    <div id="add-product-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="toggleForm()">&times;</span>
            <h3>Agregar/Editar Producto</h3>
            <form id="product-form" class="form">
                <input type="hidden" id="product-id" name="product-id">
                <div class="form-group">
                    <label for="name">Nombre del Producto:</label>
                    <input type="text" id="name" name="name" placeholder="Ingrese el nombre del producto" required>
                </div>
                <div class="form-group">
                    <label for="price">Precio del Producto:</label>
                    <input type="number" id="price" name="price" placeholder="Ingrese el precio del producto" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleForm()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/products.js"></script>
    <script>
        document.getElementById('add-product').addEventListener('click', function () {
            document.getElementById('product-id').value = ''; // Limpiar el campo oculto de ID
            document.getElementById('name').value = ''; // Limpiar el campo de nombre
            document.getElementById('price').value = ''; // Limpiar el campo de precio
            toggleForm(); // Mostrar el formulario
        });
    </script>
</body>
</html>
