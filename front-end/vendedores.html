<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vendedores</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
</head>
<body>
    <header>
        <h1>Gestión de Vendedores</h1>
    </header>
    <nav>
        <ul>
            <li><a href="gestion_pedidos.html">Inicio</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vendedores.html">Vendedores</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="pedido_producto.html">Detalles de Pedido</a></li>
        </ul>
    </nav>
    <main class="container">
        <h2>Lista de Vendedores</h2>
        <button class="button" id="add-seller">Agregar Vendedor</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="seller-list">
                <!-- Los datos de la API se cargarán aquí -->
            </tbody>
        </table>
    </main>

    <form id="seller-form">
        <input type="hidden" id="seller-id" />
        <label for="name">Nombre del Vendedor:</label>
        <input type="text" id="name" placeholder="Ingrese el nombre del vendedor" required />
        <button type="submit">Guardar</button>
    </form>

    <script src="js/sellers.js"></script>
</body>
</html>
