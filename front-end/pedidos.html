<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
</head>
<body>
    <header>
        <h1 class="titulo">Gestión de Pedidos</h1>
    </header>
    <nav>
        <ul>
            <li><a href="gestion_pedidos.html">Inicio</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vendedores.html">Vendedores</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="pedido-producto.html">Detalles de Pedido</a></li>
        </ul>
    </nav>
    <main class="container">
        <h2>Lista de Pedidos</h2>
        <!-- Formulario de búsqueda con opciones -->
        <form id="search-form" class="search-form">
            <select id="search-type">
                <option value="id">ID</option>
                <option value="client">Nombre del Cliente</option>
                <option value="seller">Nombre del Vendedor</option>
            </select>
            <input type="text" id="search-input" placeholder="Buscar..." />
            <button type="submit">🔍</button>
        </form>
        <!-- Botones para interactuar con los pedidos -->
        <button id="loadPedidosButton" class="button">Cargar Pedidos</button>
        <button id="addPedidoButton" class="button">Agregar Pedido</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Clientes</th>
                    <th>Vendedor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="pedidosTableBody">
                <!-- Aquí se cargarán dinámicamente los pedidos -->
            </tbody>
        </table>
    </main>

    <!-- Modal para agregar o editar un pedido -->
    <div id="pedidoModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h3 id="modalTitle">Agregar Nuevo Pedido</h3>
            <form id="pedidoForm">
                <input type="hidden" id="pedidoId" name="pedidoId">
                <label for="client">Cliente:</label>
                <input type="text" id="client" name="client" placeholder="Ingrese el cliente" required>
                <label for="seller">Vendedor:</label>
                <input type="text" id="seller" name="seller" placeholder="Ingrese el vendedor" required>
                <label for="dateOrder">Fecha:</label>
                <input type="date" id="dateOrder" name="dateOrder" required>
                <div class="form-actions">
                    <button type="submit" class="button">Guardar</button>
                    <button type="button" id="cancelPedidoButton" class="button cancel">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/obfuscated/pedidos.js"></script>
    <script src="js/obfuscated/principal.js"></script>
</body>
</html>
