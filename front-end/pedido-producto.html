<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del pedido</title>
    <link rel="stylesheet" href="css/gestion-pedidos.css">
</head>
<body>
    <header>
        <h1 class="titulo">Detalles del pedido</h1>
    </header>
    <nav>
        <ul>
            <li><a href="gestion_pedidos.html">Inicio</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="vendedores.html">Vendedores</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="pedido-producto.html">Detalles de Pedido</a></li>
        </ul>
    </nav>
    <main class="container">
        <h2>Detalles del pedido</h2>
        <!-- Formulario de búsqueda con opciones -->
        <form id="search-form" class="search-form">
            <select id="search-type">
                <option value="id">ID</option>
                <option value="product">Nombre del Producto</option>
            </select>
            <input type="text" id="search-input" placeholder="Buscar..." />
            <button type="submit">🔍</button>
        </form>

        <!-- Botón para agregar un nuevo detalle de pedido -->
        <button class="button" onclick="showCreateForm()">Agregar Detalle de Pedido</button>
        
        <!-- Formulario para crear o editar un detalle de pedido -->
        <form id="orderProductForm" style="display: none;">
            <h3>Agregar Detalle de Pedido</h3>
            <label for="order">ID del Pedido:</label>
            <input type="number" id="order" placeholder="Ingrese el ID del pedido" required>
            <label for="product">ID del Producto:</label>
            <input type="number" id="product" placeholder="Ingrese el ID del producto" required>
            <label for="quantity">Cantidad:</label>
            <input type="number" id="quantity" placeholder="Ingrese la cantidad" required>
            <label for="price">Precio Unitario:</label>
            <input type="number" step="0.01" id="price" placeholder="Ingrese el precio unitario" required>
            <div class="form-actions">
                <button type="button" class="button" id="saveButton" onclick="createOrderProductHandler()">Guardar</button>
                <button type="button" class="button cancel" onclick="hideCreateForm()">Cancelar</button>
            </div>
        </form>

        <!-- Tabla para mostrar los detalles de pedidos -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Pedido</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los datos se cargarán dinámicamente -->
            </tbody>
        </table>
    </main>
    <script src="js/pedidoProducto.js"></script>
</body>
</html>
